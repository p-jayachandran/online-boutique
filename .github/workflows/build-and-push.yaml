name: Build and Push Online Boutique Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    # Keep your existing build job steps and matrix here

  deploy-to-ec2:
    name: Deploy to EC2 Kubernetes
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          cd /home/ubuntu/online-boutique
          git pull origin main
          sudo kubectl apply -k kubernetes-manifests/v
