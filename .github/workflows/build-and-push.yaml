
  deploy-to-ec2:
    name: Deploy to EC2 Kubernetes
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          cd /home/ubuntu/online-boutique
          git pull origin main

          sudo kubectl apply -k kubernetes-manifests/

          sudo kubectl rollout status deployment/adservice --timeout=180s
          sudo kubectl rollout status deployment/cartservice --timeout=180s
          sudo kubectl rollout status deployment/checkoutservice --timeout=180s
          sudo kubectl rollout status deployment/currencyservice --timeout=180s
          sudo kubectl rollout status deployment/emailservice --timeout=180s
          sudo kubectl rollout status deployment/frontend --timeout=180s
          sudo kubectl rollout status deployment/paymentservice --timeout=180s
          sudo kubectl rollout status deployment/productcatalogservice --timeout=180s
          sudo kubectl rollout status deployment/recommendationservice --timeout=180s
          sudo kubectl rollout status deployment/shippingservice --timeout=180s
