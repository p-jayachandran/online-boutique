name: Build and Push Online Boutique Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - service: adservice
            context: ./src/adservice
          - service: cartservice
            context: ./src/cartservice/src
          - service: checkoutservice
            context: ./src/checkoutservice
          - service: currencyservice
            context: ./src/currencyservice
          - service: emailservice
            context: ./src/emailservice
          - service: frontend
            context: ./src/frontend
          - service: loadgenerator
            context: ./src/loadgenerator
          - service: paymentservice
            context: ./src/paymentservice
          - service: productcatalogservice
            context: ./src/productcatalogservice
          - service: recommendationservice
            context: ./src/recommendationservice
          - service: shippingservice
            context: ./src/shippingservice
          - service: shoppingassistantservice
            context: ./src/shoppingassistantservice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/online-boutique-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/online-boutique-${{ matrix.service }}:${{ github.sha }}

     
  deploy-to-ec2:
    name: Deploy to EC2 Kubernetes
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Get GitHub Runner IP
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "GitHub Runner Public IP: $RUNNER_IP"
          echo "Waiting 300 seconds for AWS Security Group update..."
          sleep 300

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Kubernetes
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
              cd ~/online-boutique
              git pull origin main

              sudo kubectl apply -k kubernetes-manifests/

              sudo kubectl rollout status deployment/adservice --timeout=180s
              sudo kubectl rollout status deployment/cartservice --timeout=180s
              sudo kubectl rollout status deployment/checkoutservice --timeout=180s
              sudo kubectl rollout status deployment/currencyservice --timeout=180s
              sudo kubectl rollout status deployment/emailservice --timeout=180s
              sudo kubectl rollout status deployment/frontend --timeout=180s
              sudo kubectl rollout status deployment/paymentservice --timeout=180s
              sudo kubectl rollout status deployment/productcatalogservice --timeout=180s
              sudo kubectl rollout status deployment/recommendationservice --timeout=180s
              sudo kubectl rollout status deployment/shippingservice --timeout=180s
          EOF

